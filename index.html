<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playful Yes/No</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Will you be my Valentine? 💖</h1>
    <div class="buttons">
      <button id="yes-btn" onclick="handleYesClick()">Yes</button>
      <button id="no-btn" onclick="handleNoClick()">No</button>
    </div>
    <div id="result" class="hidden">Yay! 🎉</div>
    <div id="tease-toast"></div>
    <div class="gif-container">
      <img src="https://media.tenor.com/4nZz5zvZzEwAAAAC/poker-cards.gif" alt="poker cards">
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
